spring:
  application:
    name: investment-copilot

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/copilot}
    username: ${SPRING_DATASOURCE_USERNAME:copilot}
    password: ${SPRING_DATASOURCE_PASSWORD:copilot}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379/0}

  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8000}

app:
  cors-origins:
    - ${CORS_ORIGIN:http://localhost:3000}
  quote-cache-ttl-seconds: ${QUOTE_CACHE_TTL_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health, info
